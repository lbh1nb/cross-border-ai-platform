[project]
name = "cross-border-ai-platform"
version = "0.5.2"
description = "跨境电商 AI 运营中台：飞书 + AI Agent 全链路自动化"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineer" }]

dependencies = [
    # 飞书 SDK
    "lark-oapi>=1.4.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # 配置与数据校验
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # 日志
    "loguru>=0.7.2",
    # 定时任务
    "apscheduler>=3.10.4",
    # Web 服务（卡片回调）
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    # 数据采集
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    # AI 框架（第3周 AI Agent 启用）
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=0.2.0",
    # 向量数据库（第4周客服 Agent 启用）
    "chromadb>=0.5.0",
    # 桌面 GUI（08-07 新增）
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",        # httpx mock
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
build = [
    # PyInstaller 打包成 exe（08-07 新增）
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
